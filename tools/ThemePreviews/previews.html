// ---------------------------------------------------------------------------
// Primitives
// ---------------------------------------------------------------------------
const R = (x, y, w, h, f, rx = 0, a = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${a}/>`;
const C = (cx, cy, r, f, a = '') => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${a}/>`;
const E = (cx, cy, rx, ry, f, a = '') => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${a}/>`;
const P = (d, f, a = '') => `<path d="${d}" fill="${f}" ${a}/>`;
const S = (d, stroke, w, a = '') => `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${a}/>`;
const T = (x, y, txt, a) => `<text x="${x}" y="${y}" ${a}>${txt}</text>`;
const lin = (id, stops, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map((s, i) => `<stop offset="${i / (stops.length - 1)}" stop-color="${s}"/>`).join('')}</linearGradient>`;
const rad = (id, stops, cx = 0.35, cy = 0.3) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="0.75">${stops.map((s, i) => `<stop offset="${i / (stops.length - 1)}" stop-color="${s}"/>`).join('')}</radialGradient>`;
const shadow = (cx, y, rx, op = 0.1) => E(cx, y, rx, 7, '#000', `opacity="${op}" filter="url(#soft)"`);

function wave(y, amp, len, x0, x1, bottom, phase = 0) {
    let d = `M${x0 - phase} ${bottom} L${x0 - phase} ${y}`;
    for (let x = x0 - phase; x < x1 + len; x += len) {
        d += ` q${len / 4} ${-amp} ${len / 2} 0 t${len / 2} 0`;
    }
    return d + ` L${x1 + len} ${bottom} Z`;
}

function waveLine(y, amp, len, x0, x1, phase = 0) {
    let d = `M${x0 - phase} ${y}`;
    for (let x = x0 - phase; x < x1; x += len) {
        d += ` q${len / 4} ${-amp} ${len / 2} 0 t${len / 2} 0`;
    }
    return d;
}

function icons(color, cy) {
    const y = cy - 66;
    return `<g transform="translate(0 ${y})" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

        <rect x="1179" y="59" width="22" height="20" rx="2.5"/>
        <path d="M1184 59 v-3 a6 6 0 0 1 12 0 v3"/>
    </g>`;
}

// Storefront skeleton, driven by the theme's own variables

function render(t) {
    const X0 = t.boxed ? 32 : 0, W = t.boxed ? 1216 : 1280;
    const h = t.hero;
    let s = '';

    s += R(0, 0, 1280, 960, t.siteBg);
    s += R(X0, 0, W, 960, t.bodyBg);

    // Menubar
    s += R(X0, 0, W, 32, t.menubar.bg);
    s += [64, 140].map((x, i) => R(x, 13, [56, 70][i], 6, t.menubar.fg, 3, 'opacity="0.8"')).join('');
    s += [960, 1040, 1130].map((x, i) => R(x, 13, [60, 70, 86][i], 6, t.menubar.fg, 3, 'opacity="0.8"')).join('');
    if (t.menubar.line) s += R(X0, 31, W, 1, t.menubar.line);

    // Shopbar
    s += R(X0, 32, W, 76, t.shopbar.bg);
    s += T(64, 84, 'FLEX', `font-family='${t.headFont}' font-size="30" font-weight="700" letter-spacing="1" fill="${t.shopbar.logo}"`);
    const sr = t.search.pill ? 20 : (t.search.rx || 4);
    s += R(410, 50, 430, 40, t.search.bg, sr, `stroke="${t.search.border}" stroke-width="1.5"`);
    s += R(434, 67, 150, 6, t.search.placeholder || '#d9dcea', 3);
    const ic = t.search.icon || t.shopbar.fg;
    s += `<circle cx="810" cy="67" r="7.5" fill="none" stroke="${ic}" stroke-width="2.5"/><line x1="815.5" y1="72.5" x2="822" y2="79" stroke="${ic}" stroke-width="2.5" stroke-linecap="round"/>`;
    s += icons(t.shopbar.fg, 70);
    s += C(1205, 57, 10, t.badge.bg) + T(1205, 61.5, '3', `font-family='${t.font}' font-size="13" font-weight="700" fill="${t.badge.fg}" text-anchor="middle"`);

    // Navigation (laid out after mount)
    s += R(X0, 108, W, 44, t.nav.bg);
    if (t.nav.line) s += R(X0, t.nav.lineTop ? 108 : 151, W, 1, t.nav.line);
    s += `<g id="nav" font-family='${t.nav.font || t.font}' font-size="${t.nav.size}" font-weight="${t.nav.weight}" letter-spacing="${t.nav.spacing || 0.2}" fill="${t.nav.fg}">` +
        t.nav.items.map(n => T(64, 136, t.nav.upper ? n.toUpperCase() : n, '')).join('') + '</g>';
    s += `<rect id="navSel" x="0" y="147" width="0" height="3" fill="${t.nav.selected}"/>`;

    // Hero
    if (h.panel) s += R(64, 176, 1152, 324, h.panel.fill, h.panel.rx);
    const k = h.kicker;
    s += T(100, 238, k.text, `font-family='${k.font || t.headFont}' font-size="${k.size}" font-weight="${k.weight}" letter-spacing="${k.spacing || 0.5}" fill="${k.color}" ${k.italic ? 'font-style="italic"' : ''}`);
    const ti = h.title;
    s += T(94, 350, ti.text, `font-family='${t.headFont}' font-size="${ti.size}" font-weight="${ti.weight}" letter-spacing="${ti.spacing}" fill="${ti.color}"`);
    s += R(100, 386, 300, 8, h.lines, 4) + R(100, 406, 230, 8, h.lines, 4);
    s += R(100, 440, 176, 48, h.btn1.bg, h.btn1.rx) + R(136, 461, 104, 6, h.btn1.label, 3);
    s += R(296, 440, 140, 48, h.btn2.bg, h.btn2.rx, `stroke="${h.btn2.stroke}" stroke-width="2"`) + R(331, 461, 70, 6, h.btn2.label, 3);
    s += h.art();

    // Products
    for (let i = 0; i < 4; i++) {
        const x = 64 + i * 296, cx = x + 132, cy = 620;
        if (t.tile) s += R(x, 528, 264, 184, t.tile.fill, t.tile.rx, t.tile.stroke ? `stroke="${t.tile.stroke}" stroke-width="1.5"` : '');
        s += t.items[i](cx, cy);
        s += R(x, 728, [160, 140, 170, 150][i], 8, t.caption[0], 4);
        s += R(x, 746, [100, 120, 90, 110][i], 8, t.caption[1], 4);
        s += T(x, 788, t.price.values[i], `font-family='${t.price.font}' font-size="${t.price.size}" font-weight="${t.price.weight}" fill="${t.price.color}"`);
    }
    s += `<text id="oldPrice" x="0" y="788" font-family='${t.price.font}' font-size="16" fill="${t.price.oldColor}" text-decoration="line-through">${t.price.old}</text>`;
    s += R(1146, 540, 58, 30, t.sale.bg, t.sale.rx) + T(1175, 561, '−20%', `font-family='${t.font}' font-size="15" font-weight="700" fill="${t.sale.fg}" text-anchor="middle"`);

    // Footer
    const f = t.footer;
    s += R(X0, 820, W, 140, f.bg);
    if (f.line) s += R(X0, 820, W, 1, f.line);
    s += [[64, 96], [360, 80], [656, 110]].map(([x, w]) => R(x, 852, w, 8, f.title, 4)).join('');
    s += `<g fill="${f.link}" opacity="${f.linkOpacity || 0.9}">` +
        [[64, 150, 118], [360, 132, 96], [656, 140, 104]].map(([x, a, b]) => R(x, 876, a, 6, f.link, 3) + R(x, 894, b, 6, f.link, 3)).join('') + '</g>';
    s += [1112, 1152, 1192].map(x => C(x, 878, 15, f.socialFill || 'none', `stroke="${f.social}" stroke-width="2"`)).join('');
    s += R(X0, 928, W, 32, f.bottom) + R(64, 941, 180, 6, f.link, 3, `opacity="${(f.linkOpacity || 0.9) * 0.8}"`);

    const defs = `
        <filter id="soft" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="46"/></filter>
        <filter id="blurSm" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#18243a" flood-opacity="0.14"/></filter>
        <filter id="grain" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.9"/></feComponentTransfer></filter>
        <clipPath id="heroClip"><rect x="64" y="176" width="1152" height="324" rx="${h.panel ? h.panel.rx : 0}"/></clipPath>
        ${(t.defs || []).join('')}`;

    return `<svg id="svg" width="1280" height="960" viewBox="0 0 1280 960" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${s}</svg>`;
}

function layout(t) {
    if (t.after) t.after();
    if (t.scene) return;

    // Navigation items flow by their measured width; the second one is selected.
    const items = [...document.querySelectorAll('#nav text')];
    let x = 64;
    items.forEach((el, i) => {
        el.setAttribute('x', x);
        const w = el.getComputedTextLength();
        if (i === 1) {
            const sel = document.getElementById('navSel');
            sel.setAttribute('x', x - 2);
            sel.setAttribute('width', w + 4);
        }
        x += w + 38;
    });

    // Old price sits right after the last price.
    const prices = [...document.querySelectorAll('svg > text')].filter(el => el.getAttribute('y') === '788' && el.id !== 'oldPrice');
    const last = prices[prices.length - 1];
    document.getElementById('oldPrice').setAttribute('x', 952 + last.getComputedTextLength() + 12);
}

const name = new URLSearchParams(location.search).get('theme') || 'Flex';
const theme = themes[name];
document.title = name;
document.body.style.background = theme.siteBg;
document.getElementById('root').innerHTML = theme.scene ? theme.scene() : render(theme);
