name: Build and Deploy Smartstore to Plesk

on:
  push:
    branches:
      - main  # Oder 'master' – je nachdem, wie Ihr Haupt-Branch heißt
  workflow_dispatch: # <--- Ermöglicht den manuellen Start per Knopfdruck

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    # 1. Quellcode aus GitHub auschecken
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. .NET SDK bereitstellen (Passend zur Smartstore-Version, z.B. .NET 8 oder 9)
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x' # Hier ggf. Ihre Version eintragen (z.B. 9.0.x)

    # 3. Projektabhängigkeiten wiederherstellen
    - name: Restore dependencies
      run: dotnet restore Smartstore.sln

    # 4. Smartstore kompilieren (Publish erzeugen)
    # Das Skript kompiliert nur das Haupt-Webprojekt in einen temporären Ausgabeordner
    - name: Publish Smartstore.Web
      run: dotnet publish src/Smartstore.Web/Smartstore.Web.csproj --configuration Release --output ./publish_output

    # 5. Die fertig kompilierten DLLs und Dateien per FTP zu Plesk hochladen
    - name: FTP Deploy to Plesk
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: 'thuneck' # Ersetzen Sie dies mit Ihrem echten FTP-User!
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish_output/
        server-dir: /httpdocs/               # Ihr Plesk-Hauptordner
