name: Publish nightly dev Docker image

on:
  # Manual trigger
  workflow_dispatch:
  # At 06:00 AM, on Tuesday, Thursday, and Saturday
  schedule:
  - cron: "0 6 * * TUE,THU,SAT"
  
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDTERMINALLOGGER: 'off'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  publish-linux:
    name: Publish Linux nightly (amd64 and arm64)
    uses: ./.github/workflows/publish-linux.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: nightly
      run-tests: true

  publish-windows:
    name: Build, Test, Publish and Deploy nightly Windows Docker image
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Build
      # The checked-in ModuleBuilder still targets .NET 9; allow it to run on .NET 10.
      env:
        DOTNET_ROLL_FORWARD: Major
      run: dotnet build Smartstore.sln -c Release

    - name: Test
      run: dotnet test Smartstore.sln -c Release --no-restore --no-build
    
    - name: Log in to the GitHub Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish and Push for Windows
      run: | 
        dotnet publish src/Smartstore.Web/Smartstore.Web.csproj -c Release -o .temp/windows-image/publish --no-restore --no-build --no-self-contained
        Copy-Item Nano.Dockerfile .temp/windows-image/
        docker build --build-arg SOURCE=publish -f .temp/windows-image/Nano.Dockerfile -t ghcr.io/smartstore/smartstore-windows:nightly .temp/windows-image
        docker push ghcr.io/smartstore/smartstore-windows:nightly

  cleanup-old-packages:
    name: Delete untagged Windows nightly package versions
    needs: [publish-linux, publish-windows]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        # Linux architecture manifests are untagged but still referenced by the shared tags.
        # Do not delete Linux versions until cleanup follows manifest references.
        package: [smartstore-windows]
    steps:
    - name: Delete untagged versions of ${{ matrix.package }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.DELETE_PACKAGES_TOKEN }}
        script: |
          const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
            package_type: 'container',
            package_name: '${{ matrix.package }}',
            org: 'smartstore',
            per_page: 100
          });

          const untagged = versions.data.filter(v => !v.metadata?.container?.tags?.length);
          console.log(`Found ${untagged.length} untagged versions`);

          for (const v of untagged) {
            try {
              await github.rest.packages.deletePackageVersionForOrg({
                package_type: 'container',
                package_name: '${{ matrix.package }}',
                org: 'smartstore',
                package_version_id: v.id
              });
              console.log(`Deleted: ${v.id} (${v.name})`);
            } catch (err) {
              console.log(`Failed to delete ${v.id}: ${err.message}`);
            }
          }

