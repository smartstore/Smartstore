name: Publish release Docker image

on:
  push:
    branches:
      - '6.4.0.x' # << Change this for new versions.
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDTERMINALLOGGER: 'off'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-linux:
    name: Publish Linux release (amd64 and arm64)
    uses: ./.github/workflows/publish-linux.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: release

  publish-windows:
    name: Build, Publish and Deploy stable Windows release Docker image
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Format branch label
      id: format-branch-label
      run: bash .github/FormatBranchLabel.sh

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x # << Change this to current .NET version.

    - name: Build
      # The checked-in ModuleBuilder still targets .NET 9; allow it to run on .NET 10.
      env:
        DOTNET_ROLL_FORWARD: Major
      run: dotnet build Smartstore.sln -c Release

    - name: Log in to the GitHub Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish and Push for Windows
      run: | 
        dotnet publish src/Smartstore.Web/Smartstore.Web.csproj -c Release -o .temp/windows-image/publish --no-restore --no-build --no-self-contained
        Copy-Item Nano.Dockerfile .temp/windows-image/
        docker build --build-arg SOURCE=publish -f .temp/windows-image/Nano.Dockerfile -t ghcr.io/smartstore/smartstore-windows:latest -t ghcr.io/smartstore/smartstore-windows:${{ steps.format-branch-label.outputs.branch-label }} .temp/windows-image
        docker push ghcr.io/smartstore/smartstore-windows:latest
        docker push ghcr.io/smartstore/smartstore-windows:${{ steps.format-branch-label.outputs.branch-label }}
